hydra:
  run:
    dir: .
  output_subdir: null

exp_name: "qwen-0.5B-rlvr-fsdp2-pg"
seed: 42
logging_dir: ./output/logs
output_dir: ./output

checkpoint_config:
  type: file_system
  output_dir: ./output/checkpoints/${exp_name}

track_with: tensorboard
tracker_kwargs:
  log_dir: ./output/tensorboard

# system_envs:
#   USE_MODELSCOPE: "1"

num_gpus_per_node: 1

max_steps: 2
save_steps: 10
logging_steps: 1
eval_steps: 10
resume_from_checkpoint: false

rollout_batch_size: 2
prompt_length: 128
response_length: 64

num_return_sequences_in_group: 2
ppo_epochs: 1
adv_estimator: "grpo"

# clip
value_clip: 0.5
reward_clip: 10
advantage_clip: 0.2
dual_clip_loss: true

# normalize
norm_mean_type: ~
norm_std_type: ~

# data mask
max_len_mask: false
difficulty_mask: false
difficulty_low_threshold: 0.1
difficulty_high_threshold: 0.95
error_max_len_clip: false

# data weight
difficulty_loss_weight: false
length_loss_weight: false

# reward
add_token_level_kl: false

# advantage
whiten_advantages: true

pretrain: Qwen/Qwen2.5-0.5B-Instruct
reward_pretrain: Qwen/Qwen2.5-0.5B-Instruct

reference_configs:
  default:
    worker_cls: roll.pipeline.rlvr.actor_worker.ActorWorker
    infer_batch_size: 2
    model_args:
      flash_attn: fa2
      dtype: bf16
    data_args:
      template: qwen2_5
    strategy_args:
      strategy_name: fsdp2_infer
      strategy_config:
        fsdp_size: 1
        param_dtype: bf16
        reduce_dtype: float32
        reshard_after_forward: true
        offload_policy: false
    device_mapping: "list(range(0,1))"

validation:
  data_args:
    template: qwen2_5
    domain_interleave_probs:
      default: 1.0
    file_name:
      - /home/zxw/Alibaba-ROLL/adapt-prefixgrouper/data/test.parquet
    max_prompt_length: 128
  generating_args:
    max_new_tokens: 16
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.99
    num_return_sequences: 1

actor_train:
  model_args:
    flash_attn: fa2
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 0
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 1
    warmup_steps: 0
    lr_scheduler_type: constant
  data_args:
    domain_interleave_probs:
      default: 1.0
    template: qwen2_5
    messages: messages
    file_name:
      - /home/zxw/Alibaba-ROLL/adapt-prefixgrouper/data/train.parquet
    max_prompt_length: 128
    preprocessing_num_workers: 1
  strategy_args:
    strategy_name: fsdp2_train
    strategy_config:
      fsdp_size: 1
      param_dtype: bf16
      reduce_dtype: float32
      reshard_after_forward: true
      offload_policy: false
      use_prefix_grouper: false
      prefix_grouper_group_size: 2
  device_mapping: "list(range(0,1))"
  infer_batch_size: 2

actor_infer:
  model_args:
    flash_attn: fa2
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: 32
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.99
    num_return_sequences: 2
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.7
      block_size: 16
      max_model_len: 512
  device_mapping: "list(range(0,1))"
  infer_batch_size: 2

reference:
  model_args:
    flash_attn: fa2
    disable_gradient_checkpointing: true
    dtype: bf16
    model_type: ~
  data_args:
    template: qwen2_5
  strategy_args:
    strategy_name: fsdp2_infer
    strategy_config:
      fsdp_size: 1
      param_dtype: bf16
      reduce_dtype: float32
      reshard_after_forward: true
      offload_policy: false
  device_mapping: "list(range(0,1))"
  infer_batch_size: 2

rewards:
  default:
    worker_cls: roll.pipeline.rlvr.rewards.math_rule_reward_worker.MathRuleRewardWorker
    reward_type: soft
    response_length_penalty_coef: 0.0
    model_args:
      model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct
    data_args:
      template: qwen2_5
    tag_included:
      - math_rule
    world_size: 1
    infer_batch_size: 2
    device_mapping: "list(range(0,1))"

reward_normalization:
  grouping: tags
  method: identity
